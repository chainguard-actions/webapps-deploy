name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release or revert to (e.g., v3.2.1)'
        required: true
        type: string
      revert:
        description: 'Revert releases/vX to this existing tag?'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate tag format
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format: $TAG. Expected: v<major>.<minor>.<patch>"
            exit 1
          fi

      - name: Parse version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          safe_major=$(printf '%s' "$MAJOR" | tr -d '\n\r')
          echo "major=${safe_major}" >> "$GITHUB_OUTPUT"
          echo "branch=releases/${safe_major}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revert == true && inputs.tag || steps.version.outputs.branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release new tag
        if: ${{ inputs.revert == false }}
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          INPUT_TAG: ${{ inputs.tag }}
          VERSION_BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          # Update the major tag (e.g., v3) to point to same commit as inputs.tag
          git tag -fa "${MAJOR}" -m "Release ${INPUT_TAG}"
          git push origin "${MAJOR}" --force

          echo "## ✅ Release ${INPUT_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${INPUT_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${VERSION_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Revert to existing tag
        if: ${{ inputs.revert == true }}
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          git push origin "${INPUT_TAG}:refs/heads/${BRANCH}" --force

          echo "## ⏪ Reverted ${BRANCH} to ${INPUT_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${BRANCH}\` now points to \`${INPUT_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
