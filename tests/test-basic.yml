name: Test basic usage - Azure WebApp deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy package zip
        run: |
          mkdir -p /tmp/deploy-pkg
          echo "<html><body>Hello World</body></html>" > /tmp/deploy-pkg/index.html
          cd /tmp/deploy-pkg && zip -r /tmp/app.zip .

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          app-name: 'test-webapp-harness'
          package: '/tmp/app.zip'
          slot-name: 'production'

      - name: Assert action ran and failed gracefully (no Azure credentials)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "webapp-url: $WEBAPP_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$WEBAPP_URL" ]; then
              echo "FAIL: action succeeded but webapp-url output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with webapp-url='$WEBAPP_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Azure credentials available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
