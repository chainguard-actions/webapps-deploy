name: Test - No Azure credentials (error handling)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without credentials (expect failure)
        id: action
        uses: .
        with:
          app-name: my-test-webapp
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without Azure credentials, but it succeeded"
            exit 1
          fi
          echo "PASS: action failed as expected when no credentials are provided"
