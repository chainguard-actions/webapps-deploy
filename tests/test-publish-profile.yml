name: Test publish-profile auth - Azure WebApp
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy package folder
        run: |
          mkdir -p /tmp/webapp-content
          echo "<html><body>Test App</body></html>" > /tmp/webapp-content/index.html

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          app-name: 'test-webapp-profile-harness'
          publish-profile: |
            <publishData><publishProfile profileName="test" publishMethod="MSDeploy"
            publishUrl="fake.scm.azurewebsites.net" userName="$test"
            userPWD="fakepassword"
            destinationAppUrl="https://test.azurewebsites.net"></publishProfile></publishData>
          package: '/tmp/webapp-content'
          slot-name: 'production'

      - name: Assert action ran and failed gracefully (invalid publish profile)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "webapp-url: $WEBAPP_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$WEBAPP_URL" ]; then
              echo "FAIL: action succeeded but webapp-url output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with webapp-url='$WEBAPP_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid/fake publish profile credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
