name: Test - Startup command not allowed with publish profile (error handling)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with startup-command and invalid publish-profile (expect failure)
        id: action
        uses: .
        with:
          app-name: my-test-webapp
          publish-profile: 'not-a-valid-publish-profile'
          startup-command: 'dotnet run'
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with startup-command and publish-profile, but it succeeded"
            exit 1
          fi
          echo "PASS: action failed as expected with startup-command and publish-profile"
